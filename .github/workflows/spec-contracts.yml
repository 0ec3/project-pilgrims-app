name: Spec contract validation

on:
  pull_request:
    paths:
      - 'SPECS/**'
      - 'tools/specs/validate_spec_contracts.py'
      - '.github/workflows/spec-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'SPECS/**'
      - 'tools/specs/validate_spec_contracts.py'
      - '.github/workflows/spec-contracts.yml'

jobs:
  validate-spec-contracts:
    name: Validate spec contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: python -m pip install pyyaml

      - name: Validate machine-readable spec contracts
        run: python tools/specs/validate_spec_contracts.py
