    guest_allowed: false
    free_allowed: false
    supporter_allowed: true
    entitlement_key: GROUP_LIVE_BOARD
    auth_required: true
    server_trust_required: true
    network_required: true
    downgrade_behavior: manual_checkins_and_basic_group_access_remain_available
  phrasebook.text_and_big_text_cards:
    criticality: emergency_assistive
    guest_allowed: true
