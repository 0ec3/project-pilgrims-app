validation_rules:
  - Client code must not invent capabilities or entitlement keys not listed here or in a synchronized update to file 24.
  - Any capability marked never_gate must have release tests for guest/free access where technically applicable.
  - Any Supporter lock state must explain preserved free access and avoid implying correctness or safety is withheld.
  - Any capability with auth_required=true must define whether server_trust_required and network_required are true or false.
  - Any capability with entitlement_key=null must not render paid lock UI.
