version: 2
owner_spec: SPECS/24_FEATURE_ACCOUNT_SUBSCRIPTIONS_ENTITLEMENTS_AND_SETTINGS.md
related_specs:
  - SPECS/03_PRODUCT_CHARTER_AND_SCOPE.md
  - SPECS/18_FEATURE_RITUALS_RIC_AND_RELIGIOUS_CONTENT.md
  - SPECS/19_FEATURE_MAPS_SAVE_MY_GATE_AND_3_D_WAYFINDING.md
  - SPECS/20_FEATURE_GROUP_HUB_CHECKINS_REGROUP_AND_SHARED_COORDINATION.md
  - SPECS/21_FEATURE_PLANNER_REMINDERS_WALLET_NOTES_AND_BOOKMARKS.md
  - SPECS/22_FEATURE_PHRASEBOOK_EMERGENCY_SAFETY_AND_ASSISTIVE_TOOLS.md
  - SPECS/23_FEATURE_OFFLINE_PACKS_AUDIO_AND_CONTENT_DISTRIBUTION.md
  - SPECS/29_SECURITY_PRIVACY_COMPLIANCE_AND_RISK_REGISTER.md
rule: >-
  Supporter may unlock convenience, enrichment, automation, and richer offline assets.
  It must never gate ritual correctness, RIC, baseline recovery/navigation, essential safety,
  emergency cards, phrase text, medical profile basics, or basic group coordination.
field_contract:
  required_for_every_capability:
    - criticality
    - guest_allowed
    - free_allowed
    - supporter_allowed
  conditional_rules:
    - Paid-only capabilities must define entitlement_key.
    - Server-trusted writes must set auth_required=true and server_trust_required=true.
    - Local-only capabilities must not require auth or server trust.
    - Never-gate capabilities must be available to free users and supporters.
capabilities:
  ritual.guidance.text:
    criticality: correctness
    guest_allowed: true
    free_allowed: true
    supporter_allowed: true
    never_gate: true
    offline_required: true
    auth_required: false
    server_trust_required: false
    local_only: false
  ritual.ric.basic:
    criticality: correctness
    guest_allowed: true
    free_allowed: true
    supporter_allowed: true
    never_gate: true
    offline_required: true
    auth_required: false
    server_trust_required: false
    local_only: false
  maps.save_my_gate:
    criticality: recovery
    guest_allowed: true
    free_allowed: true
    supporter_allowed: true
    never_gate: true
    offline_required: true
    auth_required: false
    server_trust_required: false
    local_only: true
  maps.basic_recall_and_text_guidance:
    criticality: recovery
    guest_allowed: true
    free_allowed: true
    supporter_allowed: true
    never_gate: true
    offline_required: true
    auth_required: false
    server_trust_required: false
    local_only: false
  group.create_basic:
    criticality: coordination
    guest_allowed: false
    free_allowed: true
    supporter_allowed: true
    never_gate: true
    auth_required: true
    server_trust_required: true
    network_required: true
    entitlement_key: null
    downgrade_behavior: remains_available_to_authenticated_free_users
  group.join_and_manual_coordination:
    criticality: coordination
    guest_allowed: false
    free_allowed: true
    supporter_allowed: true
    never_gate: true
    auth_required: true
    server_trust_required: true
    network_required: true
