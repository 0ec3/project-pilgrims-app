validation_rules:
  - File 11 canonical screen inventory and this traceability map must stay in one-to-one sync unless a screen is explicitly marked deferred_with_rationale.
  - Every screen implementation must reference feature_owner, offline behavior, accessibility notes, analytics events, and release evidence owner from this file.
  - Every critical flow listed here must have a release-evidence mapping before ship.
  - New screens require updates to this file and file 11 in the same change.
  - Entitlement dependencies here must match SPECS/CONTRACTS/entitlement_capability_policy.yaml or be explicitly marked optional/local/non-entitlement.
