version: 2
owner_spec: SPECS/11_SCREENS_STATES_NAVIGATION_AND_UI_BLUEPRINTS.md
related_specs:
  - SPECS/18_FEATURE_RITUALS_RIC_AND_RELIGIOUS_CONTENT.md
  - SPECS/19_FEATURE_MAPS_SAVE_MY_GATE_AND_3_D_WAYFINDING.md
  - SPECS/20_FEATURE_GROUP_HUB_CHECKINS_REGROUP_AND_SHARED_COORDINATION.md
  - SPECS/21_FEATURE_PLANNER_REMINDERS_WALLET_NOTES_AND_BOOKMARKS.md
  - SPECS/22_FEATURE_PHRASEBOOK_EMERGENCY_SAFETY_AND_ASSISTIVE_TOOLS.md
  - SPECS/23_FEATURE_OFFLINE_PACKS_AUDIO_AND_CONTENT_DISTRIBUTION.md
  - SPECS/24_FEATURE_ACCOUNT_SUBSCRIPTIONS_ENTITLEMENTS_AND_SETTINGS.md
  - SPECS/25_FEATURE_ONBOARDING_HOME_AND_SIMPLE_MODE.md
rule: >-
  File 11 owns screen/state/navigation contracts. Feature-family files own business behavior.
  Every canonical screen listed in file 11 must appear here with a feature owner, critical flows,
  offline behavior, permission dependencies, entitlement dependencies, accessibility notes,
  analytics events, and release-evidence owner. If this contract and file 11 conflict,
  implementation must stop and update both through change control before code proceeds.
metadata_defaults:
  offline_behavior: must_be_explicit_per_screen
  permission_dependencies: []
  entitlement_dependencies: []
  accessibility_notes: [large_text, screen_reader, non_color_status, rtl_safe]
  release_evidence_owner: SPEC_28
  implementation_status: planned
traceability:
  startup_resolver:
    feature_owner: SPEC_25
    category: shell_entry
    critical_flows: [startup_route, migration_gate, deep_link_resolution, offline_start]
    offline_behavior: routes_to_last_safe_local_state
    analytics_events: [app_startup_resolve, screen_startup_resolver_view]
  onboarding_welcome:
    feature_owner: SPEC_25
    category: flow_screen
    critical_flows: [first_launch_value, no_forced_account, no_permission_wall]
    offline_behavior: available_offline_after_bundle_load
    analytics_events: [screen_onboarding_welcome_view]
  language_preferences_setup:
    feature_owner: SPEC_25
    category: flow_screen
    critical_flows: [locale_choice, rtl_preview, simple_mode_offer]
    offline_behavior: local_preference_only
    analytics_events: [screen_language_preferences_setup_view]
  account_gate:
    feature_owner: SPEC_24
    category: flow_screen
    critical_flows: [protected_action_explanation, auth_start, auth_failure, return_to_task]
    offline_behavior: explains_auth_unavailable_without_blocking_local_features
    permission_dependencies: [auth_provider]
    analytics_events: [account_gate_view, account_gate_complete]
  home_root:
    feature_owner: SPEC_25
    category: root_screen
    critical_flows: [continue_ritual, urgent_shortcuts, saved_gate_recall, group_safe_action, pack_readiness]
    offline_behavior: useful_with_local_state_and_cached_snapshots
    analytics_events: [screen_home_root_view]
  rituals_root:
    feature_owner: SPEC_18
    category: root_screen
    critical_flows: [start_ritual, resume_ritual, open_ric, offline_content]
    offline_behavior: core_guidance_available_from_local_content
    analytics_events: [screen_rituals_root_view]
  start_resume_ritual:
    feature_owner: SPEC_18
    category: flow_screen
    critical_flows: [start_umrah, resume_session, choose_supported_context]
    offline_behavior: creates_or_resumes_local_session
    analytics_events: [ritual_start, ritual_resume]
  ritual_session_overview:
